[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-analyst"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "polars",
  "duckdb",
  "pyarrow",
  "pydantic",
  "scikit-learn",
  "scipy",
  "pyyaml",
  "numpy",
  "pikepdf",
  "pypdf",
  "matplotlib",
  "reportlab",
  "svglib",
]

[project.optional-dependencies]
model = ["llama-cpp-python"]
dev = ["pytest", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
